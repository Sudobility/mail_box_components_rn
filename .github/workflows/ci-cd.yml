---
name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write
  id-token: write
  deployments: write
  packages: write

jobs:
  cicd:
    uses: johnqh/workflows/.github/workflows/unified-cicd.yml@main
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_PACKAGES_READ_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
    with:
      publish-target: github

  publish-specialized:
    needs: cicd
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        package:
          - agriculture-components-rn
          - analytics-components-rn
          - auth-components-rn
          - automotive-components-rn
          - collaboration-components-rn
          - communication-components-rn
          - construction-components-rn
          - design-components-rn
          - devops-components-rn
          - documents-components-rn
          - ecommerce-components-rn
          - education-components-rn
          - email-components-rn
          - energy-components-rn
          - entertainment-components-rn
          - entity-components-rn
          - events-components-rn
          - finance-components-rn
          - fitness-components-rn
          - food-components-rn
          - gaming-components-rn
          - government-components-rn
          - healthcare-components-rn
          - hr-components-rn
          - insurance-components-rn
          - interaction-components-rn
          - iot-components-rn
          - legal-components-rn
          - logistics-components-rn
          - manufacturing-components-rn
          - marketing-components-rn
          - media-components-rn
          - monitoring-components-rn
          - nonprofit-components-rn
          - project-management-components-rn
          - ratelimit-components-rn
          - realestate-components-rn
          - retail-components-rn
          - scheduling-components-rn
          - scientific-components-rn
          - search-components-rn
          - security-components-rn
          - social-components-rn
          - subscription-components-rn
          - travel-components-rn
          - visualization-components-rn
          - web3-components-rn
          - workflow-components-rn
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Configure GitHub Packages registry
        run: |
          printf 'registry=https://registry.npmjs.org/\n@sudobility:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc
          cp .npmrc "$HOME/.npmrc"
      - name: Check version on GitHub Packages
        id: cv
        working-directory: ./packages/${{ matrix.package }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          PUB=$(npm view "$NAME@$LOCAL" version 2>/dev/null || echo "")
          if [ "$PUB" = "$LOCAL" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Install
        if: steps.cv.outputs.skip == '0'
        working-directory: ./packages/${{ matrix.package }}
        run: bun install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          BUN_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build
        if: steps.cv.outputs.skip == '0'
        working-directory: ./packages/${{ matrix.package }}
        run: bun run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          BUN_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Publish to GitHub Packages
        if: steps.cv.outputs.skip == '0'
        working-directory: ./packages/${{ matrix.package }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
